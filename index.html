<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <title>Casa cmg?</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        #conteudo {
            background-image: url("wallhaven-g8e3yl_1920x1080.png");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;

            width: 100%;
            height: 100vh;

            position: fixed;
            top: 0;
            left: 0;

            display: flex;
            justify-content: center;
            align-items: center;

            text-align: center;
            padding: 20px;
        }

        /* CONTAINER TRANSPARENTE */
        .container-amor {
            width: 90%;
            max-width: 500px;

            padding: 30px;

            background: rgba(255, 255, 255, 0.18);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);

            border: 1px solid rgba(255, 255, 255, 0.35);
            border-radius: 25px;

            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.3);

            color: white;
        }

        /* FOTO */
        .foto {
            width: 180px;
            height: 180px;

            object-fit: cover;

            border-radius: 50%;

            border: 4px solid white;

            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.4);

            margin-bottom: 20px;
        }

        h2 {
            font-size: 30px;
            margin-bottom: 25px;

            text-shadow: 2px 2px 5px rgba(0, 0, 0, 0.6);
        }

        .btn {
            background: black;
            color: white;

            border: none;

            padding: 12px;
            width: 90px;

            border-radius: 8px;

            margin: 5px;

            font-size: 16px;

            transition: 0.2s;
        }

        .btn:hover {
            transform: scale(1.08);
            background: #222;
        }

        #nao {
            position: relative;
        }

        .frase {
            font-size: 17px;
            margin-top: 15px;
            color: white;

            text-shadow: 1px 1px 4px black;
        }

        /* Celular */
        @media (max-width: 600px) {

            .container-amor {
                padding: 25px 15px;
            }

            .foto {
                width: 140px;
                height: 140px;
            }

            h2 {
                font-size: 24px;
            }
        }
    </style>
</head>

<body>

    <div id="conteudo">

        <div class="container-amor">

          

            <img src="txt.jpg"
        
                class="foto">

            <h2>
                Aceita casar cmg? 
            </h2>

            <button class="btn" onclick="sim()">
                SIM ❤️
            </button>

            <button class="btn"
                id="nao"
                onclick="desvia(this)"
                onmouseover="desvia(this)"
                ontouchstart="desvia(this)">
                NÃO 😭
            </button>

            

        </div>

    </div>

    <script>

        function sim() {

            alert("Você aceitou casar comigo! :) ");

            location.href=
                "//youtu.be/J36z7AnhvOM?si=TLj29JkhNxL_d3Zo";
        }


        function desvia(btn) {

            btn.style.position = "fixed";

            btn.style.bottom = geraPosicao(10, 80);

            btn.style.left = geraPosicao(10, 80);

            console.log("opa, desviei... 😂");
        }


        function geraPosicao(min, max) {

            return (
                Math.random() * (max - min) + min
            ) + "%";

        }

    </script>

</body>

</html>
